<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9-Б CLASS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    color: #222;
    text-align: center;
}

header {
    background: linear-gradient(135deg, #123b80, #2878df);
    color: white;
    padding: 65px 15px;
}

header h1 {
    font-size: 48px;
    margin-bottom: 12px;
}

header p {
    font-size: 18px;
}

section {
    padding: 35px 15px;
}

h2 {
    color: #123b80;
    margin-bottom: 20px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    max-width: 900px;
    margin: auto;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 15px;
}

footer {
    background: #123b80;
    color: white;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>9-Б CLASS</h1>
    <p>Биз бир класс — бир үй-бүлөбүз! ❤️</p>
</header>

<section>
    <h2>📸 Биздин сүрөттөр</h2>

    <div class="gallery">
        <img src="FullSizeRender.jpeg" alt="9-Б класс">
    </div>
</section>

<footer>
    © 2026 | 9-Б CLASS
</footer>

</body>
</html>
